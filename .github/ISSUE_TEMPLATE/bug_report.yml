name: 🐞 Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! You can write in English, Deutsch, Français or Español.
        ⚠️ **Never post secrets** (seed, view key, passwords, tokens, `config.toml`, `.env`) or personal data
        such as real IP addresses or your mining address. Security issues: please use the private form linked
        in [SECURITY.md](https://github.com/nexovaanalytics-oss/Moneta/blob/main/SECURITY.md) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - XMR-Ledger (dashboard, report, prices, power tracking)
        - NAS stack (monerod, P2Pool, compose.yaml)
        - Miner scripts (deploy/mac)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: input
    id: version
    attributes:
      label: Ledger version
      description: Shown in the dashboard footer and in the first log line, e.g. "XMR-Ledger 1.1.0 (abc1234)".
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        NAS / server: e.g. Synology DS920+, DSM 7.2
        Miner: e.g. MacBook Air M1, macOS 15, XMRig 6.26.0
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: e.g. `sudo docker logs --tail 50 xmr-ledger`. Remove addresses, IPs and tokens first.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and personal data (seed, view key, tokens, passwords, IPs, addresses).
          required: true
