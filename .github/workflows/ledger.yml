# Testet den XMR-Ledger und baut das Container-Image nach ghcr.io/<owner>/xmr-ledger
#   Push auf main      -> Tag "edge" (+ sha-…)
#   Git-Tag ledger-vX.Y.Z -> Tag "X.Y.Z" (+ sha-…)  ← diese Version trägt man auf der NAS in .env ein
name: ledger

on:
  push:
    branches: [main]
    tags: ["ledger-v*"]
    paths: ["ledger/**", "LICENSE", "THIRD_PARTY.md", ".github/workflows/ledger.yml"]
  pull_request:
    paths: ["ledger/**", "LICENSE", "THIRD_PARTY.md", ".github/workflows/ledger.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ledger/requirements.txt pytest
      - run: python -m pytest -q ledger/tests

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xmr-ledger
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=match,pattern=ledger-v(\d+\.\d+\.\d+),group=1
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ledger/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
