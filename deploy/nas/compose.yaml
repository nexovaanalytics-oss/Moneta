# NAS-Stack: monerod, P2Pool (mini), Nur-Lesen-Wallet, XMR-Ledger
# Getestet auf Synology DS920+ (DSM 7.2, Container Manager). Daneben eine .env (siehe .env.example).
# Starten/Aktualisieren (Projektname anpassen, z. B. der Name im Container Manager):
#   sudo docker compose -p monero-pool pull && sudo docker compose -p monero-pool up -d

services:
  monerod:
    image: ghcr.io/sethforprivacy/simple-monerod:latest
    container_name: monerod
    restart: unless-stopped
    volumes:
      - bitmonero:/home/monero
    ports:
      - "18080:18080"   # Monero P2P
      - "18089:18089"   # eingeschränkter RPC, z. B. für Wallets im LAN
    command: >-
      --rpc-restricted-bind-ip=0.0.0.0 --rpc-restricted-bind-port=18089
      --zmq-pub=tcp://0.0.0.0:18084
      --prune-blockchain --sync-pruned-blocks
      --no-igd --enable-dns-blocklist
      --in-peers=32 --out-peers=32

  p2pool:
    image: ghcr.io/sethforprivacy/p2pool:latest
    container_name: p2pool
    restart: unless-stopped
    tty: true
    stdin_open: true
    depends_on:
      - monerod
    volumes:
      - p2pool-data:/home/p2pool
    ports:
      - "3333:3333"     # Stratum für die Miner
      - "37888:37888"   # P2P der mini-Sidechain
    command: >-
      --wallet "${XMR_ADDRESS:?XMR_ADDRESS in .env setzen}"
      --mini
      --light-mode
      --host "monerod" --rpc-port "18089" --zmq-port "18084"
      --stratum "0.0.0.0:3333" --p2p "0.0.0.0:37888"
      --loglevel "1"

  # Nur-Lesen-Wallet (View-Key) am eigenen Node; nur intern erreichbar
  wallet-rpc:
    image: ${LEDGER_IMAGE:-ghcr.io/nexovaanalytics-oss/xmr-ledger}:${LEDGER_VERSION:?LEDGER_VERSION in .env setzen}
    container_name: wallet-rpc
    restart: unless-stopped
    depends_on:
      - monerod
    healthcheck:
      disable: true     # der Healthcheck im Image gilt dem Dashboard, nicht wallet-rpc
    volumes:
      - ./ledger/wallets:/wallets
    command: >-
      monero-wallet-rpc
      --daemon-address monerod:18089 --trusted-daemon
      --rpc-bind-ip 0.0.0.0 --rpc-bind-port 18082 --confirm-external-bind
      --disable-rpc-login
      --wallet-dir /wallets
      --log-file /wallets/monero-wallet-rpc.log --max-log-files 2

  # Dashboard, Kurse, Stromerfassung, Berichte
  ledger:
    image: ${LEDGER_IMAGE:-ghcr.io/nexovaanalytics-oss/xmr-ledger}:${LEDGER_VERSION:?LEDGER_VERSION in .env setzen}
    container_name: xmr-ledger
    restart: unless-stopped
    depends_on:
      - wallet-rpc
    volumes:
      - ./ledger/data:/data
      - p2pool-data:/p2pool:ro   # nur lesend: p2pool.log für „Auszahlung → Rechner“
    ports:
      - "8090:8090"     # Dashboard: http://<NAS-IP>:8090

volumes:
  bitmonero:
  p2pool-data:
