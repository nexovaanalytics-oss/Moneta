# XMR-Ledger – Konfiguration
# Kopieren nach ledger/data/config.toml auf der NAS und ausfüllen (docs/de/ledger.md; EN: docs/en/ledger.md).
# Diese Datei enthält deinen geheimen View-Key: nicht weitergeben, nicht ins Internet.

[general]
timezone = "Europe/Berlin"
data_dir = "/data"

[wallet]
# Hauptadresse deiner Mining-Wallet (95 Zeichen, beginnt mit 4) – dieselbe wie in der docker-compose.yml bei p2pool
address = "4..."
# Geheimer View-Key: in monero-wallet-cli mit dem Befehl  viewkey  anzeigen (Zeile "secret:")
# Er erlaubt nur das Ansehen von Eingängen, nicht das Ausgeben.
view_key = ""
restore_height = 0          # Blockhöhe kurz vor Anlage der Wallet (spart Zeit beim ersten Scan)
# Passwort für die Nur-Lesen-Wallet-Datei auf der NAS (frei wählbar, nicht dein Mac-Wallet-Passwort)
wallet_password = ""
rpc_url = "http://wallet-rpc:18082/json_rpc"

[web]
port = 8090
user = "admin"
password = ""          # Pflicht – das Dashboard zeigt Finanzdaten

[prices]
# Optional: kostenloser CoinGecko-Demo-API-Key (höheres Abfragelimit). Leer lassen geht auch.
coingecko_api_key = ""

[node]
# Eigener Monero-Node (eingeschränkter RPC) für Difficulty und Blockbelohnung auf der Seite „Auswertung“.
# Im Compose-Stack ist der Standard richtig; leer ("") schaltet die Abfrage ab. Es geht nichts ins Internet.
rpc_url = "http://monerod:18089/json_rpc"

[pool]
# Für neue Rechner: Installer und Menüleisten-App finden den Ledger im Heimnetz (GET /api/moneta) und
# übernehmen daraus die Stratum-Adresse von P2Pool. Leerer Host = dieselbe IP wie der Ledger (NAS).
stratum_host = ""
stratum_port = 3333
# Kopplung neuer Rechner per Code aus dem Dashboard (Seite „Geräte“). false schaltet /api/pair ab.
pairing = true
# Auszahlung → Rechner: Der Ledger liest das P2Pool-Log nur lesend (Compose: p2pool-data:/p2pool:ro) und ordnet
# jede Auszahlung den eigenen Shares im PPLNS-Fenster zu. Nur Anzeige, ändert keine Zuflüsse oder Kurse.
log = "/p2pool/p2pool.log"
# Sidechain von P2Pool: mini (Fenster ≈ 6 h), nano (≈ 18 h) oder main. Muss zum P2Pool-Start passen (--mini).
sidechain = "mini"

[power]
poll_seconds = 60
# Optionaler Mehrverbrauch der NAS durch Node + Pool (läuft rund um die Uhr). 0 = nicht ansetzen.
nas_extra_watts = 0.0
nas_note = ""

# Strompreis brutto in ct/kWh. Bei Tarifänderung einen weiteren Block mit neuem valid_from ergänzen.
[[power.tariff]]
valid_from = "2026-01-01"
ct_per_kwh = 35.0

# Rechner lassen sich im Dashboard unter „Geräte“ koppeln (empfohlen) oder hier eintragen.
# Je Rechner ein Block. url = IP des Macs (feste IP im Router vergeben) + XMRig-API-Port.
# token = derselbe Wert wie bei --http-access-token im xmrig-Befehl.
# watts = gemessener MEHRverbrauch beim Minen (siehe docs/de/setup-mac.md; EN: docs/en/setup-mac.md).
[[miner]]
name = "Rechner 1 (z. B. MacBook Pro)"
url = "http://<IP-DES-RECHNERS>:18000"
token = ""
watts = 15.0
note = "Beispiel: gemessen am TT.MM.JJJJ mit einmessen.sh/powermetrics: <Last> W Last (<n> Threads) - <Leerlauf> W Leerlauf = <Differenz> W; +10 % Netzteil, aufgerundet wegen RAM"

[[miner]]
name = "Rechner 2 (z. B. MacBook Air)"
url = "http://<IP-DES-ZWEITEN-RECHNERS>:18000"
token = ""
watts = 8.0
note = "Beispiel: gemessen am TT.MM.JJJJ mit einmessen.sh/powermetrics: <Last> W Last (<n> Threads) - <Leerlauf> W Leerlauf = <Differenz> W; +10 % Netzteil, aufgerundet wegen RAM"
